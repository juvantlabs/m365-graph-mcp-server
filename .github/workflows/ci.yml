name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Coverage (only when tests exist)
        if: ${{ hashFiles('tests/unit/**/*.test.ts') != '' }}
        run: npm run test:unit -- --coverage

      - name: Integration tests
        env:
          VENDOR_SANDBOX_TOKEN: ${{ secrets.VENDOR_SANDBOX_TOKEN }}
        run: |
          if [ -z "${VENDOR_SANDBOX_TOKEN:-}" ]; then
            echo "::notice::No VENDOR_SANDBOX_TOKEN secret — skipping integration tests."
          else
            npm run test:integration
          fi

      - name: npm audit (moderate or higher)
        run: npm audit --audit-level=moderate

      - name: Stdout discipline (no console.log in src/)
        run: |
          set -euo pipefail
          if grep -rnE 'console\.log\(' src/ ; then
            echo "::error::console.log found in src/ — corrupts MCP stdio JSON-RPC framing. Use console.error for diagnostics."
            exit 1
          fi
          echo "OK — no console.log in src/"

      - name: Dead-code check (unused security helpers)
        run: |
          set -euo pipefail
          # Heuristic: every exported validate*/sanitize*/guard*/enforce*/assert*
          # symbol declared in src/ must be referenced from at least one OTHER
          # file in src/. Unreachable defense-in-depth code is a security smell
          # (handbook anti-pattern S1).
          fail=0
          while IFS= read -r decl; do
            [ -z "$decl" ] && continue
            file=${decl%%:*}
            line=${decl#*:}
            name=$(echo "$line" | grep -oE '(validate|sanitize|guard|enforce|assert)[A-Z][A-Za-z0-9_]*' | head -1)
            [ -z "$name" ] && continue
            uses=$(grep -rEln "\\b$name\\b" src/ | grep -v "^$file$" | wc -l | tr -d ' ')
            if [ "$uses" -eq 0 ]; then
              echo "::error file=$file::Exported security helper '$name' is not imported from any other file in src/ — dead code is a security smell (handbook anti-pattern S1)."
              fail=1
            fi
          done < <(grep -rnE '^export (function|const|class) (validate|sanitize|guard|enforce|assert)[A-Z]' src/ || true)
          if [ "$fail" -eq 0 ]; then
            echo "OK — no dead security helpers."
          fi
          exit "$fail"

      - name: README env-var accuracy
        run: |
          set -euo pipefail
          # Every env var documented in README.md's "## Environment variables"
          # section must be referenced in src/ via process.env.X. Mismatches
          # fail the build (handbook anti-pattern S2: env vars documented but
          # not wired).
          # Skip placeholder tokens containing '<' (e.g. <VENDOR>_API_KEY) and
          # short common acronyms.
          if [ ! -f README.md ]; then
            echo "::warning::No README.md — skipping env-var accuracy check."
            exit 0
          fi
          section=$(awk '
            /^## Environment variables/  { in_section=1; next }
            /^## /                       { in_section=0 }
            in_section                   { print }
          ' README.md)
          if [ -z "$section" ]; then
            echo "::notice::No '## Environment variables' section in README.md — skipping env-var accuracy check."
            exit 0
          fi
          fail=0
          # Extract `BACKTICK_QUOTED_UPPERCASE_TOKENS`, drop placeholders + acronyms.
          vars=$(echo "$section" \
            | grep -oE '`[A-Z][A-Z0-9_]+`' \
            | tr -d '`' \
            | sort -u \
            | grep -vE '^(MCP|API|URL|HTTP|HTTPS|JSON|UUID|SDK|MIT|CI|PR|README|TLS|SSL|UTC|UTF8|HTML|REST|RPC|YAML|TOML|XML|RFC|JS|TS)$' \
            || true)
          for var in $vars; do
            # Skip placeholder-shaped names from the same section
            if echo "$section" | grep -qE "<[^>]*>${var}|${var}[^<]*<[^>]*>"; then
              continue
            fi
            if ! grep -rqE "process\\.env\\.${var}\\b" src/ ; then
              echo "::error::Env var '${var}' is documented in README.md '## Environment variables' but not referenced in src/ via process.env.${var} (handbook anti-pattern S2)."
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "OK — README env-var documentation matches src/."
          fi
          exit "$fail"

      - name: Confirmation-token enforcement (handbook ADR 0004 Track 1)
        run: |
          set -euo pipefail
          # Every tool annotated `category: "write_irreversible"` MUST:
          #   1. Declare confirmation_token somewhere in its source
          #      (typically inputSchema.properties).
          #   2. Import or reference consumeConfirmation in its handler.
          # Removing or relaxing this check requires a successor ADR
          # superseding handbook ADR 0004.
          fail=0
          while IFS= read -r match; do
            [ -z "$match" ] && continue
            file=${match%%:*}
            if ! grep -qE 'confirmation_token' "$file"; then
              echo "::error file=$file::Tool annotated category=\"write_irreversible\" but source does not reference confirmation_token (handbook ADR 0004 Track 1)."
              fail=1
            fi
            if ! grep -qE 'consumeConfirmation' "$file"; then
              echo "::error file=$file::Tool annotated category=\"write_irreversible\" but source does not reference consumeConfirmation (handbook ADR 0004 Track 1)."
              fail=1
            fi
          done < <(grep -rEln 'category:\s*"write_irreversible"' src/tools/ || true)
          if [ "$fail" -eq 0 ]; then
            echo "OK — every write_irreversible tool gates via confirmation_token + consumeConfirmation."
          fi
          exit "$fail"

      - name: Permission-mutation surface invariant (decisions#210 Layer A)
        run: |
          set -euo pipefail
          # Surface invariant for the `permission_mutating` ToolCategory.
          #
          # Two checks, both fail the build:
          #
          #   1. SCOPE check: src/auth/msal.ts MUST NOT include any of the
          #      permission-mutation-class MSAL scopes
          #      (Sites.Manage.All, Sites.FullControl.All,
          #      Application.ReadWrite.All) unless at least one tool is
          #      classified `category: "permission_mutating"` AND that
          #      tool's filename appears in PERMISSION_MUTATING_ALLOWLIST
          #      below. v0.4.0 baseline: zero such tools.
          #
          #   2. ENDPOINT check: no tool source under src/tools/ may grep-match
          #      a permission/sharing Graph endpoint shape
          #      (/permissions, createLink, /invite, assignSensitivityLabel,
          #      transferOwnership) unless that tool is classified
          #      `category: "permission_mutating"` AND on the allowlist.
          #
          # The allowlist is intentionally maintained INLINE in this workflow
          # (not in src/) so adding a permission-mutating tool requires a
          # CI/security-review diff that surfaces clearly in code review.
          # The legal-ip-specific driveId deny-list is enforced DOWNSTREAM in
          # the harness — this repo stays brand-agnostic per OSS host rules.

          PERMISSION_MUTATING_ALLOWLIST=""   # empty in v0.4.0 baseline

          fail=0

          # --- (1) MSAL scope check ---------------------------------------
          escalating_scopes='Sites\.Manage\.All|Sites\.FullControl\.All|Application\.ReadWrite\.All'
          if grep -qE "\"($escalating_scopes)\"" src/auth/msal.ts; then
            classified_count=$(grep -rEln 'category:\s*"permission_mutating"' src/tools/ | wc -l | tr -d ' ')
            if [ "$classified_count" -eq 0 ]; then
              echo "::error file=src/auth/msal.ts::MSAL scope set includes a permission-mutation-class scope (Sites.Manage.All / Sites.FullControl.All / Application.ReadWrite.All) but no tool is classified category=\"permission_mutating\". Either remove the scope or classify the consuming tool AND add its filename to PERMISSION_MUTATING_ALLOWLIST in .github/workflows/ci.yml (decisions#210 Layer A)."
              fail=1
            fi
          fi

          # --- (2) Endpoint-shape check -----------------------------------
          # Patterns intentionally narrow: only fire on Graph-mutation shapes,
          # not on doc comments. We look for: createLink( | /permissions" |
          # /permissions') | /invite" | /invite') | assignSensitivityLabel(
          # | transferOwnership(.
          endpoint_pattern='createLink\(|/permissions["'\'']|/invite["'\'']|assignSensitivityLabel\(|transferOwnership\('
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if grep -qE 'category:\s*"permission_mutating"' "$file"; then
              base=$(basename "$file")
              if ! echo " $PERMISSION_MUTATING_ALLOWLIST " | grep -qE " $base "; then
                echo "::error file=$file::Tool classified category=\"permission_mutating\" but its filename ($base) is not in PERMISSION_MUTATING_ALLOWLIST in .github/workflows/ci.yml. Add it explicitly to surface the change in code review (decisions#210 Layer A)."
                fail=1
              fi
            else
              echo "::error file=$file::Tool touches a permission/sharing Graph endpoint shape but is not classified category=\"permission_mutating\". Classify it AND add its filename to PERMISSION_MUTATING_ALLOWLIST in .github/workflows/ci.yml (decisions#210 Layer A)."
              fail=1
            fi
          done < <(grep -rEln "$endpoint_pattern" src/tools/ || true)

          if [ "$fail" -eq 0 ]; then
            echo "OK — no unclassified permission-mutation surface; MSAL scope set within v0.4.0 baseline."
          fi
          exit "$fail"
