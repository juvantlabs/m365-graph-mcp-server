name: Publish

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual approval gate. Configure the 'production' environment in the repo
    # settings (Settings → Environments) to require reviewer approval before
    # the npm publish step runs. Without this gate, a compromised tag pushes
    # straight to npm.
    environment:
      name: production
      url: https://www.npmjs.com/package/${{ github.event.repository.name }}
    permissions:
      contents: read
      # id-token: write enables both:
      #   - npm provenance attestation (signature on the published tarball)
      #   - npm Trusted Publishing (OIDC-based auth — no NPM_TOKEN needed)
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: npm audit (moderate or higher)
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Publish to npm (Trusted Publishing + provenance)
        # No NODE_AUTH_TOKEN. Authentication is via OIDC: npm verifies
        # the GitHub Actions OIDC token's claims (repo, workflow,
        # environment) match the trusted publisher registered for this
        # package on npmjs.com. Migrated from a granular access token
        # (NPM_TOKEN) to Trusted Publishing on 2026-05-04 — no static
        # secret to rotate, scope tied to this exact (repo, workflow,
        # environment) tuple.
        run: npm publish --access=public --provenance
